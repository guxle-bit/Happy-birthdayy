<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Подарочный пак</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@500;700;900&display=swap">
<style>
/* Одна сцена во весь экран: пак → выход характеристик → карточка «Абсолютная» + неон */
:root{
  --bg:#05060d; --bg2:#0d1030; --gold:#ffd66b; --gold2:#b8862b;
  --neon:#ff3df0; --neon2:#36f3ff; --white:#f5f6ff; --abs1:#ff2d55; --abs2:#7a2cff;
  --display:"Russo One","Arial Black",Impact,sans-serif; --body:"Rubik",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--white);font-family:var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none}
#stage{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 110%,#1b2a7a 0%,transparent 60%),radial-gradient(80% 50% at 50% -10%,#2a0f55 0%,transparent 70%),var(--bg)}
canvas#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.beams{position:absolute;inset:-50%;z-index:0;opacity:.35;
  background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(120,140,255,.18) 0deg 6deg,transparent 6deg 18deg);
  animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* ---------- ПАК ---------- */
#packWrap{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:28px;outline:none}
.pack{position:relative;width:min(62vw,250px);aspect-ratio:5/8;max-width:100%;border-radius:14px;
  background:linear-gradient(160deg,#2b0a3d 0%,#7a2cff 35%,#ff2d55 70%,#ffd66b 100%);
  box-shadow:0 0 40px rgba(255,61,240,.55),0 0 120px rgba(122,44,255,.5),inset 0 0 0 3px rgba(255,214,107,.8);
  animation:float 4.5s ease-in-out infinite;overflow:hidden;transform-style:preserve-3d}
.pack::before{content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);
  background-size:250% 100%;animation:shine 2.4s linear infinite;mix-blend-mode:overlay}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
.pack .crimp{position:absolute;left:0;right:0;height:16px;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.35) 0 6px,rgba(255,255,255,.15) 6px 12px)}
.pack .crimp.t{top:0}.pack .crimp.b{bottom:0}
.pack .ribbon-v{position:absolute;top:0;bottom:0;left:50%;width:22px;transform:translateX(-50%);
  background:linear-gradient(90deg,#b8862b,#ffe9a8,#b8862b)}
.pack .ribbon-h{position:absolute;left:0;right:0;top:38%;height:22px;
  background:linear-gradient(180deg,#b8862b,#ffe9a8,#b8862b)}
.pack .bow{position:absolute;top:calc(38% - 30px);left:50%;transform:translateX(-50%);font-size:0;width:84px;height:60px}
.pack .bow i{position:absolute;top:8px;width:40px;height:36px;border:6px solid #ffe9a8;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  box-shadow:0 0 12px rgba(255,214,107,.8)}
.pack .bow i:first-child{left:0;transform:rotate(-25deg)}.pack .bow i:last-child{right:0;transform:rotate(25deg)}
.pack .label{position:absolute;left:10px;right:10px;bottom:16%;text-align:center;font-family:var(--display);
  font-size:clamp(20px,6.4vw,28px);line-height:1.05;color:#fff;text-shadow:0 2px 0 #3a0a40,0 0 18px rgba(255,214,107,.9);
  letter-spacing:.02em;background:rgba(5,6,13,.45);padding:10px 4px;border-radius:8px;border:1px solid rgba(255,214,107,.6)}
.pack .tag{position:absolute;top:24px;left:0;right:0;text-align:center;font:700 11px var(--body);letter-spacing:.35em;color:#ffe9a8}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
.hint{font:700 13px var(--body);letter-spacing:.3em;text-transform:uppercase;color:var(--neon2);
  text-shadow:0 0 10px var(--neon2);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
#packWrap:focus-visible .pack{outline:3px solid var(--neon2);outline-offset:6px}
.pack.shake{animation:shake .09s linear infinite}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-6px,3px) rotate(-3deg)}50%{transform:translate(5px,-4px) rotate(3deg)}75%{transform:translate(-4px,-2px) rotate(-2deg)}100%{transform:translate(0,0)}}
.pack.boom{animation:boom .9s ease-in forwards}
@keyframes boom{to{transform:scale(2.4);opacity:0;filter:brightness(4)}}

/* ---------- ВСПЫШКА ---------- */
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
#flash.go{animation:flash 1.2s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}

/* ---------- ВЫХОД ХАРАКТЕРИСТИК ---------- */
#walkout{z-index:4}
.spot{position:absolute;top:-10%;width:40vw;height:130%;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 80%);
  filter:blur(8px);transform-origin:top center;opacity:.6}
.spot.l{left:5%;animation:sweepL 2.2s ease-in-out infinite alternate}
.spot.r{right:5%;animation:sweepR 2.2s ease-in-out infinite alternate}
@keyframes sweepL{from{transform:rotate(25deg)}to{transform:rotate(-12deg)}}
@keyframes sweepR{from{transform:rotate(-25deg)}to{transform:rotate(12deg)}}
.trait{position:absolute;max-width:92vw;text-align:center;font-family:var(--display);text-transform:uppercase;
  font-size:clamp(30px,9vw,74px);line-height:1.05;text-wrap:balance;opacity:0}
.trait small{display:block;font:700 clamp(11px,2.6vw,14px) var(--body);letter-spacing:.4em;margin-bottom:12px;opacity:.85}
.trait.in{animation:slam 2.2s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes slam{0%{opacity:0;transform:scale(3.2);filter:blur(10px)}22%{opacity:1;transform:scale(.94);filter:blur(0)}
  32%{transform:scale(1.03)}78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.8) translateY(-30px)}}
.trait.last.in{animation:slamStay 3.4s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes slamStay{0%{opacity:0;transform:scale(3.2);filter:blur(10px)}18%{opacity:1;transform:scale(.94);filter:blur(0)}
  28%{transform:scale(1.03)}85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.4)}}
.shakeScreen{animation:scr .3s linear}
@keyframes scr{0%,100%{transform:none}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,4px)}}

/* ---------- КАРТОЧКА ---------- */
#reveal{gap:clamp(14px,3vh,26px);z-index:4}
.cardBox{perspective:1200px}
.card{position:relative;width:min(70vw,300px,46vh);aspect-ratio:300/430;max-width:100%;
  clip-path:polygon(50% 0,64% 4%,100% 4%,100% 86%,50% 100%,0 86%,0 4%,36% 4%);
  background:
    radial-gradient(60% 40% at 50% 30%,rgba(255,45,85,.45),transparent 70%),
    linear-gradient(165deg,#0a0712 0%,#1c0b2e 40%,#3a0a24 70%,#0a0712 100%);
  transform-style:preserve-3d;opacity:0}
.card.in{animation:cardIn 2.6s cubic-bezier(.15,1.25,.35,1) forwards}
@keyframes cardIn{0%{opacity:0;transform:rotateY(-540deg) scale(.2)}60%{opacity:1}100%{opacity:1;transform:rotateY(0) scale(1)}}
.card.idle{animation:sway 5s ease-in-out infinite;opacity:1}
@keyframes sway{0%,100%{transform:rotateY(-8deg) rotateX(3deg)}50%{transform:rotateY(8deg) rotateX(-3deg)}}
.cardFrame{position:absolute;inset:0;padding:5px;clip-path:inherit;
  background:conic-gradient(from 0deg,#ff2d55,#ffd66b,#36f3ff,#7a2cff,#ff3df0,#ff2d55);animation:hue 4s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.cardInner{position:absolute;inset:5px;clip-path:polygon(50% 0,64% 4%,100% 4%,100% 86%,50% 100%,0 86%,0 4%,36% 4%);
  background:
    radial-gradient(70% 45% at 50% 32%,rgba(255,45,85,.5),transparent 72%),
    repeating-linear-gradient(135deg,rgba(255,214,107,.05) 0 2px,transparent 2px 9px),
    linear-gradient(170deg,#120818 0%,#2a0b30 45%,#4a0b23 75%,#120818 100%)}
.holo{position:absolute;inset:0;z-index:6;pointer-events:none;mix-blend-mode:color-dodge;opacity:.45;
  background:linear-gradient(115deg,transparent 25%,rgba(255,61,240,.6) 38%,rgba(54,243,255,.6) 46%,rgba(255,214,107,.6) 54%,transparent 66%);
  background-size:300% 100%;animation:shine 3.2s linear infinite}
.photo{position:absolute;top:9%;left:22%;right:4%;height:52%;
  -webkit-mask-image:linear-gradient(180deg,#000 70%,transparent 100%);mask-image:linear-gradient(180deg,#000 70%,transparent 100%)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.rating{position:absolute;top:10%;left:7%;z-index:3;text-align:center;font-family:var(--display);color:var(--gold);
  text-shadow:0 0 12px rgba(255,214,107,.7)}
.rating b{display:block;font-size:clamp(34px,11vw,50px);line-height:.9;font-weight:400}
.rating span{display:block;font-size:clamp(13px,3.6vw,17px);letter-spacing:.06em;margin-top:2px}
.rating .crown{font-size:clamp(18px,5vw,24px);margin-top:6px;display:block}
.rarity{position:absolute;top:5.2%;left:50%;transform:translateX(-50%);z-index:3;font:900 clamp(8px,2.2vw,10px) var(--body);
  letter-spacing:.32em;color:#fff;background:linear-gradient(90deg,var(--abs1),var(--abs2));padding:3px 10px;border-radius:20px;white-space:nowrap;
  box-shadow:0 0 12px rgba(255,45,85,.8)}
.name{position:absolute;top:60%;left:6%;right:6%;z-index:3;text-align:center;font-family:var(--display);
  font-size:clamp(22px,7vw,32px);color:#fff;letter-spacing:.06em;text-shadow:0 0 14px rgba(255,45,85,.9)}
.name::after{content:"";display:block;height:2px;margin:6px auto 0;width:78%;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.stats{position:absolute;top:71%;left:11%;right:11%;z-index:3;display:grid;grid-template-columns:1fr 1fr;column-gap:14px;row-gap:3px;
  font-family:var(--display);font-size:clamp(12px,3.6vw,16px);color:var(--white)}
.stats div{display:flex;gap:7px;align-items:baseline;font-variant-numeric:tabular-nums}
.stats div b{color:var(--gold);font-weight:400;min-width:2ch}
.stats div:nth-child(odd){justify-content:flex-start;border-right:1px solid rgba(255,214,107,.35)}
.cardGlow{position:absolute;inset:-30px;z-index:-1;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,45,85,.55),rgba(122,44,255,.35),transparent);filter:blur(20px);opacity:0}
.cardBox.lit .cardGlow{opacity:1;transition:opacity 1s .6s}
.cardBox{position:relative}

/* ---------- НЕОН ---------- */
.neon{font-family:var(--display);text-align:center;text-transform:uppercase;line-height:1.05;
  font-size:clamp(28px,8.4vw,64px);color:#ffe6fd;opacity:0;max-width:94vw;text-wrap:balance;
  text-shadow:0 0 4px #fff,0 0 10px var(--neon),0 0 22px var(--neon),0 0 44px var(--neon),0 0 80px var(--neon)}
.neon.on{animation:neonOn 3s steps(1) forwards,neonPulse 3s ease-in-out 3s infinite}
@keyframes neonOn{0%{opacity:0}8%{opacity:1}12%{opacity:.1}20%{opacity:1}26%{opacity:.2}34%{opacity:1}100%{opacity:1}}
@keyframes neonPulse{0%,100%{opacity:1}50%{opacity:.82}}
.neon .b{color:#e6fbff;text-shadow:0 0 4px #fff,0 0 10px var(--neon2),0 0 22px var(--neon2),0 0 44px var(--neon2),0 0 80px var(--neon2)}
.again{font:700 12px var(--body);letter-spacing:.25em;text-transform:uppercase;color:var(--white);background:transparent;
  border:1px solid rgba(255,255,255,.3);border-radius:30px;padding:10px 18px;cursor:pointer;opacity:0;transition:opacity .6s}
.again.show{opacity:.75}.again:hover{opacity:1}
.again:focus-visible{outline:2px solid var(--neon2);outline-offset:3px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.beams,.pack,.spot,.card.idle,.holo,.cardFrame{animation:none!important}}
</style>
</head>
<body>


<div id="stage">
  <div class="beams"></div>
  <canvas id="fx"></canvas>

  <div class="scene" id="packScene">
    <div id="packWrap" role="button" tabindex="0" aria-label="Открыть подарок">
      <div class="pack" id="pack">
        <div class="crimp t"></div><div class="crimp b"></div>
        <div class="ribbon-v"></div><div class="ribbon-h"></div>
        <div class="bow"><i></i><i></i></div>
        <div class="tag">ПАК ✦ 99+</div>
        <div class="label">ОТКРОЙ<br>ПОДАРОК</div>
      </div>
      <div class="hint">Нажми на пак</div>
    </div>
  </div>

  <div class="scene" id="walkout" hidden>

  <div class="scene" id="reveal" hidden>

          <div class="name">АЗИЗ</div>
          <div class="stats">
            <div><b>99</b>ЛЕГ</div><div><b>99</b>УВЖ</div>
            <div><b>99</b>СИЛ</div><div><b>99</b>ДАМ</div>
            <div><b>99</b>ГЕР</div><div><b>99</b>ДОБ</div>

        </div>
        <div class="holo"></div>
      </div>
    </div>
    <div class="neon" id="neon">С днём <span class="b">рождения!</span></div>
    <button class="again" id="again" type="button">Открыть ещё раз</button>
  </div>

  <div id="flash"></div>
</div>

<script>
(()=>{
const traits=[
  {t:"Легенда",s:"Характеристика 1",c:"#ffd66b"},
  {t:"Уважаемый человек",s:"Характеристика 2",c:"#36f3ff"},
  {t:"Силач",s:"Характеристика 3",c:"#ff7a2d"},
  {t:"Дамский угодник",s:"Характеристика 4",c:"#ff3df0"},
  {t:"Герой",s:"Характеристика 5",c:"#7aff6b"},
  {t:"И просто хороший человек",s:"Главное",c:"#ffffff"}
];
const $=id=>document.getElementById(id);
const stage=$("stage"),packWrap=$("packWrap"),pack=$("pack"),flash=$("flash"),
  packScene=$("packScene"),walk=$("walkout"),reveal=$("reveal"),card=$("card"),cardBox=$("cardBox"),neon=$("neon"),again=$("again");
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---- частицы ---- */
const cv=$("fx"),ctx=cv.getContext("2d");let W,H,DPR,parts=[],stars=[],running=true,confettiOn=false;
function size(){DPR=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,p:Math.random()*6}))}
addEventListener("resize",size);size();
const COLORS=["#ffd66b","#ff3df0","#36f3ff","#ff2d55","#7a2cff","#ffffff","#7aff6b"];
function burst(x,y,n,spd,kind){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(Math.random()*.7+.3)*spd;
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,decay:Math.random()*.012+.008,c:COLORS[i%COLORS.length],
  kind:kind||"spark",w:Math.random()*8+4,h:Math.random()*5+3,rot:Math.random()*6,vr:(Math.random()-.5)*.3})}}
function firework(){const x=W*(.15+Math.random()*.7),y=H*(.1+Math.random()*.35);burst(x,y,70,7,"spark")}
function confetti(n){for(let i=0;i<n;i++)parts.push({x:Math.random()*W,y:-20-Math.random()*H*.3,vx:(Math.random()-.5)*2,vy:Math.random()*2+2,
  life:1,decay:.002,c:COLORS[i%COLORS.length],kind:"conf",w:Math.random()*8+5,h:Math.random()*5+3,rot:Math.random()*6,vr:(Math.random()-.5)*.25})}
let t=0;
function loop(){t+=.016;ctx.clearRect(0,0,W,H);
  for(const s of stars){ctx.globalAlpha=.3+.3*Math.sin(t*2+s.p);ctx.fillStyle="#cfd6ff";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}
  ctx.globalAlpha=1;
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    if(p.kind==="conf"){p.vy+=.02;p.vx+=Math.sin(t*3+i)*.05;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.rot*2)));ctx.restore();
      if(p.y>H+30)parts.splice(i,1);continue}
    p.vx*=.98;p.vy=p.vy*.98+.06;p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;
    if(p.life<=0){parts.splice(i,1);continue}
    ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.shadowBlur=12;ctx.shadowColor=p.c;ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,7);ctx.fill();ctx.shadowBlur=0}
  ctx.globalAlpha=1;
  if(confettiOn&&Math.random()<.35)confetti(2);
  requestAnimationFrame(loop)}
loop();

function doFlash(){flash.classList.remove("go");void flash.offsetWidth;flash.classList.add("go")}
function shakeScreen(){stage.classList.remove("shakeScreen");void stage.offsetWidth;stage.classList.add("shakeScreen")}

let busy=false;
async function openPack(){
  if(busy)return;busy=true;
  packWrap.querySelector(".hint").style.visibility="hidden";
  pack.classList.add("shake");await wait(2600);
  pack.classList.remove("shake");pack.classList.add("boom");
  burst(W/2,H/2,160,11);doFlash();await wait(900);
  packScene.hidden=true;walk.hidden=false;
  for(let i=0;i<traits.length;i++){
    const tr=traits[i],el=document.createElement("div");
    el.className="trait"+(i===traits.length-1?" last":"");
    el.innerHTML=`<small>${tr.s}</small>${tr.t}`;
    el.style.color=tr.c;el.style.textShadow=`0 0 18px ${tr.c},0 0 50px ${tr.c}`;
    walk.appendChild(el);void el.offsetWidth;el.classList.add("in");
    await wait(450);shakeScreen();burst(W/2,H/2,i===traits.length-1?140:60,i===traits.length-1?10:7);
    await wait(i===traits.length-1?3100:1900);el.remove();
  }
  doFlash();for(let k=0;k<3;k++)firework();
  walk.hidden=true;reveal.hidden=false;
  card.classList.remove("idle");void card.offsetWidth;card.classList.add("in");cardBox.classList.add("lit");
  await wait(2600);card.classList.remove("in");card.classList.add("idle");
  shakeScreen();burst(W/2,H*.4,200,12);confettiOn=true;confetti(120);
  neon.classList.add("on");
  fwTimer=setInterval(firework,900);
  await wait(3200);again.classList.add("show");busy=false;
}
let fwTimer=null;
function reset(){
  if(busy)return;clearInterval(fwTimer);confettiOn=false;parts=[];
  reveal.hidden=true;card.classList.remove("idle","in");cardBox.classList.remove("lit");neon.classList.remove("on");again.classList.remove("show");
  pack.classList.remove("boom","shake");packWrap.querySelector(".hint").style.visibility="";packScene.hidden=false;
}
packWrap.addEventListener("click",openPack);
packWrap.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openPack()}});
again.addEventListener("click",reset);
})();
</script>
